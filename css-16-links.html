<!DOCTYPE html>
<html>
<head>
<title>CSS - Links</title>
<style>
a:link {
  color: green;
  text-decoration: none;
}

a:visited {
  color: purple;
}

a:hover {
  color: red;
  text-decoration: underline;
}

a:active {
  color: orange;
}
</style>
</head>
<body>

<p><a href="https://www.w3schools.com">Este es un enlace de ejemplo</a></p>
<p>Pasa el mouse sobre el enlace para ver el efecto hover</p>

</body>
</html>
