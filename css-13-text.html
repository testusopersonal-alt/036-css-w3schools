<!DOCTYPE html>
<html>
<head>
<title>CSS - Text</title>
<style>
h1 {
  text-align: center;
  color: darkblue;
}

p.mayusculas {
  text-transform: uppercase;
}

p.espaciado {
  letter-spacing: 3px;
}

p.decorado {
  text-decoration: underline;
}

p.sombra {
  text-shadow: 2px 2px 5px gray;
}
</style>
</head>
<body>

<h1>Titulo centrado</h1>
<p class="mayusculas">este texto se ve en mayusculas</p>
<p class="espaciado">Texto con espaciado entre letras</p>
<p class="decorado">Texto subrayado</p>
<p class="sombra">Texto con sombra</p>

</body>
</html>
