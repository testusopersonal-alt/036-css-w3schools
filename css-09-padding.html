<!DOCTYPE html>
<html>
<head>
<title>CSS - Padding</title>
<style>
div {
  border: 1px solid black;
  background-color: lightgray;
}

.relleno {
  padding: 30px;
}

.relleno-individual {
  padding-top: 10px;
  padding-right: 40px;
  padding-bottom: 10px;
  padding-left: 40px;
}
</style>
</head>
<body>

<div class="relleno">Texto con padding de 30px</div><br>
<div class="relleno-individual">Texto con padding distinto en cada lado</div>

</body>
</html>
