<!DOCTYPE html>
<html>
<head>
<title>CSS - Margins</title>
<style>
div {
  border: 1px solid black;
}

.margen-normal {
  margin: 20px;
  background-color: lightyellow;
}

.margen-individual {
  margin-top: 50px;
  margin-right: 30px;
  margin-bottom: 10px;
  margin-left: 80px;
  background-color: lightpink;
}
</style>
</head>
<body>

<div class="margen-normal">Este div tiene margen de 20px por todos lados</div>
<div class="margen-individual">Este div tiene margenes distintos en cada lado</div>

</body>
</html>
