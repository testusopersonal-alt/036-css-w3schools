<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>03</title>
    <link rel="stylesheet" href="03-selectores.css">
</head>
<body>

    <h2>Ejemplos de selectores CSS</h2>

<p>Este parrafo usa el selector de elemento (p).</p>

<p id="para1">Este parrafo usa el selector de id (#para1).</p>


<p class="center">Este parrafo tambien usa el selector combinado (p.center).</p>

<h1 class="center">Este titulo NO se ve afectado por p.center, solo por .center</h1>
    
</body>
</html>

<!-- 
Selector	Example	Example description
#id	#firstname	Selects the element with id="firstname"
.class	.intro	Selects all elements with class="intro"
*	*	Selects all elements
element	p	Selects all <p> elements
element,element,..	div, p	Selects all <div> elements and all <p> elements  -->
