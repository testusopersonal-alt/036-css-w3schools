<!DOCTYPE html>
<html>
<head>
<title>CSS - Tables</title>
<style>
table {
  border-collapse: collapse;
  width: 100%;
}

th, td {
  border: 1px solid black;
  text-align: left;
  padding: 8px;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}

th {
  background-color: darkslategray;
  color: white;
}
</style>
</head>
<body>

<table>
  <tr>
    <th>Nombre</th>
    <th>Curso</th>
  </tr>
  <tr>
    <td>Maria</td>
    <td>Desarrollo Web</td>
  </tr>
  <tr>
    <td>Juan</td>
    <td>Bases de Datos</td>
  </tr>
</table>

</body>
</html>
